# Root tooling config — ruff is the one true linter/formatter for all Python
# under pc_agent/ (Doc 01 §4.4). No black/isort co-existence.

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".venv", "venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# S101 asserts are allowed inside the test suite (Doc 01 §4.4.2).
"pc_agent/tests/*" = ["S101"]
